name: main

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  wheels:
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read
      actions: write
      id-token: write
