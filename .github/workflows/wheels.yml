name: wheels

on:
  workflow_call:
permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    name: build-wheels
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: build-wheel
        run: |
          uv build --package aro

      - name: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: "dist/*.whl"
