# Muon (momentum + Newton-Schulz orthogonalization) on every trainable 2D matrix (including the
# token embedding and LM head); 1D parameters use AdamW with betas (0.9, 0.95) and the same
# lr/weight_decay/eps.
name: muon
lr: 6e-4
weight_decay: 0.1
alpha: 0.2 # update scale; the step is lr * alpha * update (update RMS ~1 with constant_norm)
momentum: 0.95
eps: 1e-8
constant_norm: true # normalize each update to ~unit RMS (aligns update RMS with AdamW)
ns_steps: 5 # Newton-Schulz iterations
