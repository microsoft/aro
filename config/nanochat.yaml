# NanoChat-style GPT (124M) pretraining on OpenWebText. Launch from the repository root, e.g.:
#   uv run --no-sync torchrun --standalone --nproc_per_node=4 -m trainer.pretrain --cfg nanochat
# Any field below can be overridden on the command line, e.g. `-- optimizer.lr=1e-3`.
defaults:
  # Optimizer recipe from config/optimizer/<name>.yaml; switch with `optimizer=<name>`:
  # adamw | arosinkhorn | aroadam | arosign | muon | sinkgd
  # and mixed-arosinkhorn | mixed-aroadam | mixed-arosign | mixed-muon | mixed-sinkgd
  # (mixed-* train the token embedding and LM head with AdamW).
  - optimizer: mixed-arosinkhorn
  - _self_

project:
  name: ARO-${model.name}-pretrain

compute_env:
  nodes: 1
  accelerator: cuda
  output_dir: outputs # checkpoints go to <output_dir>/checkpoints/<run> unless set below

model:
  name: nanochat
  n_layer: 12
  n_head: 12
  n_kv_head: 12
  n_embd: 768
  vocab_size: 50304 # vocabulary 50257 padded up to nearest multiple of 64 for efficiency
  sequence_len: 1024
  window_pattern: L # sliding-window pattern tiled over layers: L=full context, S=half context

training:
  batch_size: 12 # micro-batch size per GPU
  max_iters: 2600
  # Global micro-steps per optimizer step, split across GPUs: each GPU runs
  # gradient_accumulation_steps / num_gpus micro-steps, so this must be divisible by the
  # number of GPUs. Tokens per step = batch_size * sequence_len * gradient_accumulation_steps
  # (~1M here), independent of the GPU count.
  gradient_accumulation_steps: 80
  grad_clip: 1.0
  precision: bfloat16
  strategy: ddp # none (single GPU) | ddp | fsdp2
  log_interval: 10
  eval_interval: 100
  compile_model: true
  checkpoint_interval: 1000 # 0 disables checkpoint saving
  # null: <compute_env.output_dir>/checkpoints/<optimizer name>-<config hash>, so relaunching
  # the same command resumes automatically; set a path to resume a run after changing its config.
  checkpoint_path: null

optimizer:
  lr: 2e-3 # NanoChat learning rate; applies to whichever optimizer is selected above

lr_scheduler:
  name: linear-cosine
  warmup_iters: 200
  min_lr: 0.0002
  lr_decay_iters: ${training.max_iters}

logger: # Weights & Biases; set to null (`logger=null`) to disable
  project: ${project.name}
  entity: null # your W&B user or team; null uses your default entity
  host: null # custom W&B server URL; null uses the default
  mode: null # online | offline | disabled; null uses the W&B default (online)
  run_name: ${optimizer.name}-${optimizer.lr}_lr-${training.batch_size}bs-${training.gradient_accumulation_steps}acc-${model.sequence_len}ctx

data:
  name: owt
  eval_size: 200 # validation batches per evaluation (split across GPUs)
  path: data/openwebtext # train.bin/val.bin written by `python -m dataprep.openwebtext`
  num_workers: 0
  prefetch_factor: null
  pin_memory: true

seed: 1337
